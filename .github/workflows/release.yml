name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Build on the tag itself so the attestation's source ref is the release tag.
      - if: ${{ steps.release-please.outputs.release_created }}
        name: Build release assets on the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release-please.outputs.tag_name }}"
